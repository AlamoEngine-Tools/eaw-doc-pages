######################### DO NOT EDIT BELOW THIS LINE #########################
site_name: Star Wars - Empire at War - Unofficial Modding Documentation
site_url: https://aet-sweaw-modding.readthedocs.io
repo_url: https://github.com/AlamoEngine-Tools/eaw-doc-pages
repo_name: 'GitHub'
edit_uri: edit/main/docs/
site_description: The community maintained documentation for Star Wars - Empire at War and Star Wars - Empire at War - Forces of Corruption
site_author: Alamo Engine Tools and contributors
copyright: Copyright &copy; Alamo Engine Tools and contributors. All rights reserved. Licensed under the MIT license. See LICENSE file in the project root for details.
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/aet_icon.png
  favicon: assets/aet_icon.png
  font: false # [gruenwaldlk]: Disable google fonts for GDPR compliance. TODO: Add new (EaW specific) fonts.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - smarty
plugins:
    - search:
        lang: en
    - git-authors
    - git-revision-date-localized:
        fallback_to_build_date: true
        type: timeago
        timezone: Europe/Amsterdam
    - tags
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlamoEngine-Tools/eaw-doc-pages
extra_css:
  - assets/stylesheets/lean.css
