# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2
build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # git-revision-date-localized and git-authors need the full history, not a shallow clone.
      - git fetch --unshallow || true

mkdocs:
  configuration: mkdocs.yml

# Pinned in depts/requirements.txt; bump the versions there, never here.
python:
   install:
   - requirements: depts/requirements.txt
